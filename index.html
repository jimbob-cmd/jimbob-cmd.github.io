
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TabStream</title>
</head>
<body>
  <h1>TabStream</h1>
  <p>Share a browser tab with one other person.</p>

  <button id="create">Create stream</button>
  <p id="mycode"></p>

  <hr>

  <input id="code" placeholder="Enter stream code">
  <button id="join">Join stream</button>

  <p id="status">Not connected.</p>

  <h2>Stream</h2>
  <video id="screen" autoplay playsinline controls
         style="max-width:100%"></video>

  <p><button id="stop">Stop sharing</button></p>

  <h2>Chat</h2>
  <div id="messages"></div>
  <input id="message" placeholder="Message">
  <button id="send">Send</button>

  <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    let peer, connection, stream;

    function status(text) {
      $("status").textContent = text;
    }

    function showMessage(who, text) {
      const p = document.createElement("p");
      p.textContent = who + ": " + text;
      $("messages").appendChild(p);
    }

    function setupConnection(conn) {
      if (connection) {
        conn.close();
        return;
      }

      connection = conn;

      conn.on("open", () => {
        status("Connected.");
        showMessage("System", "Connected to the other person.");
      });

      conn.on("data", data => {
        if (data.type === "chat") {
          showMessage("Other person", data.text);
        }

        if (data.type === "offer") {
          answerCall(data.offer);
        }
      });

      conn.on("close", () => {
        connection = null;
        status("Connection closed.");
      });
    }

    function answerCall(offer) {
      const call = peer.call(offer.peerId, stream || undefined);
      call.on("stream", remote => {
        $("screen").srcObject = remote;
      });
    }

    $("create").onclick = async () => {
      peer = new Peer();

      peer.on("open", id => {
        $("mycode").textContent = "Your stream code: " + id;
        $("code").value = id;
        status("Waiting for the other person...");
      });

      peer.on("connection", setupConnection);

      try {
        stream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: true
        });
        $("screen").srcObject = stream;
      } catch (e) {
        status("Screen sharing cancelled or unavailable.");
      }
    };

    $("join").onclick = () => {
      const id = $("code").value.trim();
      if (!id) return;

      peer = new Peer();

      peer.on("open", () => {
        const conn = peer.connect(id);
        setupConnection(conn);
      });

      peer.on("error", e => status("Connection error: " + e.type));
    };

    $("send").onclick = () => {
      const text = $("message").value.trim();
      if (!text || !connection || !connection.open) return;

      connection.send({ type: "chat", text });
      showMessage("Me", text);
      $("message").value = "";
    };

    $("message").onkeydown = e => {
      if (e.key === "Enter") $("send").click();
    };

    $("stop").onclick = () => {
      if (stream) stream.getTracks().forEach(track => track.stop());
      stream = null;
      $("screen").srcObject = null;
    };
  </script>
</body>
</html>
