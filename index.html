<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.4 system-ui, sans-serif; background: #f2f2f2; color: #222; }
  button, input { font: inherit; }
  button { padding: 6px 12px; border: 1px solid #aaa; background: #fff; border-radius: 3px; cursor: pointer; }
  button:hover { background: #eee; }
  button:disabled { opacity: .5; cursor: default; }
  input[type=text], input[type=password] { padding: 7px; border: 1px solid #aaa; border-radius: 3px; background: #fff; }
  .hidden { display: none !important; }

  #auth { max-width: 320px; margin: 15vh auto; padding: 20px; background: #fff; border: 1px solid #ccc; }
  #auth h1 { font-size: 18px; margin: 0 0 14px; }
  #auth input { width: 100%; margin-bottom: 8px; }
  #auth .row { display: flex; gap: 8px; }
  #auth .row button { flex: 1; }
  #authMsg { color: #b00; min-height: 1.4em; margin: 6px 0 0; }

  #chat { height: 100%; display: flex; flex-direction: column; max-width: 800px; margin: 0 auto; background: #fff; border-left: 1px solid #ccc; border-right: 1px solid #ccc; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid #ccc; }
  header .right { display: flex; gap: 8px; align-items: center; }
  #adminSetup { padding: 8px 14px; background: #fff8d6; border-bottom: 1px solid #ccc; font-size: 13px; word-break: break-all; }
  #messages { flex: 1; overflow-y: auto; padding: 10px 14px; }
  .msg { padding: 6px 0; border-bottom: 1px solid #eee; }
  .msg .meta { font-size: 12px; color: #777; }
  .msg .meta b { color: #222; font-size: 14px; }
  .msg .text { white-space: pre-wrap; word-wrap: break-word; }
  .msg img { max-width: 100%; max-height: 320px; display: block; margin-top: 4px; }
  .msg .del { float: right; font-size: 12px; padding: 1px 6px; }
  form { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid #ccc; }
  form input[type=text] { flex: 1; min-width: 0; }
  #fileInfo { font-size: 12px; color: #555; padding: 0 14px 6px; }

  #members { padding: 10px 14px; border-bottom: 1px solid #ccc; background: #fafafa; max-height: 35vh; overflow-y: auto; }
  #members div { display: flex; gap: 6px; align-items: center; padding: 3px 0; }
  #members span { flex: 1; }
</style>
<script src="https://cdn.jsdelivr.net/npm/gun@0.2020.1240/gun.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gun@0.2020.1240/sea.js"></script>
</head>
<body>

<div id="auth">
  <h1>Chat</h1>
  <input id="user" type="text" placeholder="Username (letters, numbers, _)" maxlength="20" autocomplete="username">
  <input id="pass" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
  <div class="row">
    <button id="loginBtn">Log in</button>
    <button id="signupBtn">Sign up</button>
  </div>
  <p id="authMsg"></p>
</div>

<div id="chat" class="hidden">
  <header>
    <strong>Chat</strong>
    <div class="right">
      <span id="who"></span>
      <button id="membersBtn" class="hidden">Members</button>
      <button id="logoutBtn">Log out</button>
    </div>
  </header>
  <div id="adminSetup" class="hidden"></div>
  <div id="members" class="hidden"></div>
  <div id="messages"></div>
  <div id="fileInfo"></div>
  <form id="form">
    <input id="text" type="text" placeholder="Type a message" maxlength="2000" autocomplete="off">
    <input id="file" type="file" class="hidden">
    <button type="button" id="attachBtn">Attach</button>
    <button type="submit">Send</button>
  </form>
</div>

<script>
// ============ SETTINGS (see README) ============
// Change this to any long random text so your chat is separate from everyone else's.
const ROOM = "wfkwfms-FEQKKFVMSkvdsoer-294925282952051MFESJFMWS";
// After you sign up as Gallifrey, the page shows a key. Paste it between the quotes, then re-upload this file.
const ADMIN_PUB = "";
// Free public relay servers. These are run by volunteers and can change; see the README.
const PEERS = ["https://peer.wallie.io/gun"];
// ================================================

const MAX_IMAGE = 250000, MAX_FILE = 200000; // characters of base64 allowed
const $ = id => document.getElementById(id);
const gun = Gun({ peers: PEERS });
const user = gun.user();
user.recall({ sessionStorage: true });
const chat = gun.get(ROOM + "-chat");
const mod = gun.get(ROOM + "-mod");

let me = null, pendingFile = null, started = false;
const msgs = new Map();       // id -> verified message
const seen = new Map();       // id -> signed string already checked
const modEntries = new Map(); // id -> verified admin instruction
let hidden = new Set(), banned = new Set(), names = {};

const say = t => $("authMsg").textContent = t || "";
const isAdmin = () => !!me && !!ADMIN_PUB && me.pub === ADMIN_PUB;

// ---------- sign up / log in ----------
function creds() {
  const alias = $("user").value.trim().toLowerCase(), pass = $("pass").value;
  if (!/^[a-z0-9_]{3,20}$/.test(alias)) { say("Username must be 3-20 letters, numbers or underscores."); return null; }
  if (pass.length < 6) { say("Password must be at least 6 characters."); return null; }
  return { alias, pass };
}

function login(alias, pass, tries = 2) {
  say("Logging in...");
  user.auth(alias, pass, ack => {
    if (!ack.err) return;
    if (tries > 1) return setTimeout(() => login(alias, pass, tries - 1), 2000); // network may still be connecting
    say("Wrong username or password, or the network is still connecting. Try again.");
  });
}

$("signupBtn").onclick = () => {
  const c = creds(); if (!c) return;
  if (ADMIN_PUB && c.alias === "gallifrey") return say("That username is reserved.");
  say("Creating account...");
  user.create(c.alias, c.pass, ack => {
    if (ack.err) return say(/already/i.test(ack.err) ? "That username is taken." : ack.err);
    login(c.alias, c.pass);
  });
};
$("loginBtn").onclick = () => { const c = creds(); if (c) login(c.alias, c.pass); };
$("pass").addEventListener("keydown", e => { if (e.key === "Enter") $("loginBtn").click(); });
$("logoutBtn").onclick = () => { user.leave(); location.reload(); };

gun.on("auth", () => {
  if (started) return; started = true;
  me = { pub: user.is.pub, alias: user.is.alias };
  say(); $("auth").classList.add("hidden"); $("chat").classList.remove("hidden");
  $("who").textContent = me.alias;
  $("membersBtn").classList.toggle("hidden", !isAdmin());
  if (me.alias === "gallifrey" && me.pub !== ADMIN_PUB) {
    const box = $("adminSetup"); box.classList.remove("hidden");
    box.textContent = "Admin setup: copy this key into ADMIN_PUB in index.html, then re-upload the file: " + me.pub;
  }
  listen();
});

// ---------- listening ----------
function listen() {
  chat.map().on(async (d, id) => {
    if (!d || !d.s || !d.by || seen.get(id) === d.s) return;
    seen.set(id, d.s);
    const v = await SEA.verify(d.s, d.by);
    if (!v || v.id !== id || typeof v.text !== "string") return; // forged or damaged
    msgs.set(id, { id, by: d.by, name: String(v.name || ""), text: v.text.slice(0, 2000), file: v.file || null, ts: Number(v.ts) || 0 });
    draw();
  });
  mod.map().on(async (d, id) => {
    if (!d || !d.s || !ADMIN_PUB || seen.get("m" + id) === d.s) return;
    seen.set("m" + id, d.s);
    const v = await SEA.verify(d.s, ADMIN_PUB); // only instructions signed by Gallifrey count
    if (!v) return;
    modEntries.set(id, v); applyMod(); draw();
  });
}

function applyMod() {
  hidden = new Set(); banned = new Set(); names = {};
  [...modEntries.values()].sort((a, b) => a.ts - b.ts).forEach(v => {
    if (v.type === "hide") hidden.add(v.target);
    if (v.type === "ban") banned.add(v.pub);
    if (v.type === "rename") names[v.pub] = String(v.name).slice(0, 20);
  });
  if (me && banned.has(me.pub)) { user.leave(); alert("Your account has been deleted."); location.reload(); }
}

function nameOf(m) {
  if (ADMIN_PUB && m.by === ADMIN_PUB) return "Gallifrey (admin)";
  if (names[m.by]) return names[m.by];
  if (m.name.toLowerCase() === "gallifrey") return "fake gallifrey";
  return m.name || "unknown";
}

// ---------- drawing ----------
let queued = false;
function draw() { if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; render(); }); } }

function render() {
  const box = $("messages");
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.innerHTML = "";
  const list = [...msgs.values()].filter(m => !hidden.has(m.id) && !banned.has(m.by)).sort((a, b) => a.ts - b.ts).slice(-200);
  for (const m of list) {
    const el = document.createElement("div"); el.className = "msg";
    const meta = document.createElement("div"); meta.className = "meta";
    const name = document.createElement("b"); name.textContent = nameOf(m);
    meta.append(name, " " + new Date(m.ts).toLocaleString());
    if (isAdmin()) {
      const b = document.createElement("button"); b.className = "del"; b.textContent = "Delete";
      b.onclick = () => confirm("Delete this message?") && signMod({ type: "hide", target: m.id });
      meta.prepend(b);
    }
    el.append(meta);
    if (m.text) { const t = document.createElement("div"); t.className = "text"; t.textContent = m.text; el.append(t); }
    const f = m.file;
    if (f && typeof f.data === "string" && f.data.startsWith("data:")) {
      if (String(f.type).startsWith("image/") && f.data.startsWith("data:image/")) {
        const img = document.createElement("img"); img.src = f.data; img.alt = String(f.name || "picture"); el.append(img);
      } else {
        const a = document.createElement("a"); a.href = f.data; a.download = String(f.name || "file"); a.textContent = "Download " + String(f.name || "file");
        el.append(a);
      }
    }
    box.append(el);
  }
  if (atBottom) box.scrollTop = box.scrollHeight;
  if (isAdmin() && !$("members").classList.contains("hidden")) renderMembers();
}

// ---------- sending ----------
$("attachBtn").onclick = () => $("file").click();
$("file").onchange = async () => {
  const f = $("file").files[0]; $("file").value = ""; if (!f) return;
  try { pendingFile = await prepareFile(f); $("fileInfo").textContent = "Attached: " + f.name + " (sends with your next message)"; }
  catch (e) { pendingFile = null; $("fileInfo").textContent = e.message; }
};

const readData = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });

async function prepareFile(f) {
  let data = await readData(f), type = f.type || "application/octet-stream";
  if (type.startsWith("image/") && type !== "image/gif") {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = data; });
    const s = Math.min(1, 800 / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    data = c.toDataURL("image/jpeg", 0.6); type = "image/jpeg";
    if (data.length > MAX_IMAGE) throw new Error("That picture is too detailed to send. Try a smaller one.");
  } else if (data.length > MAX_FILE) throw new Error("File is too large (limit is about 150 KB).");
  return { name: f.name.slice(0, 80), type, data };
}

$("form").onsubmit = async e => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text && !pendingFile) return;
  const ts = Date.now(), id = ts + "-" + Math.random().toString(36).slice(2, 8);
  const body = { id, text, ts, name: me.alias }; if (pendingFile) body.file = pendingFile;
  $("text").value = ""; pendingFile = null; $("fileInfo").textContent = "";
  const s = await SEA.sign(body, user._.sea); // signed so nobody can pretend to be you
  chat.get(id).put({ by: me.pub, s });
};

// ---------- admin ----------
async function signMod(obj) {
  const ts = Date.now(), id = ts + "-" + Math.random().toString(36).slice(2, 8);
  const s = await SEA.sign({ ...obj, ts }, user._.sea);
  mod.get(id).put({ s });
}

$("membersBtn").onclick = () => { $("members").classList.toggle("hidden"); renderMembers(); };

function renderMembers() {
  const box = $("members"); box.innerHTML = "";
  const seenPubs = new Map();
  msgs.forEach(m => { if (!banned.has(m.by) && !seenPubs.has(m.by)) seenPubs.set(m.by, m); });
  if (!seenPubs.size) box.textContent = "Nobody has posted yet.";
  seenPubs.forEach((m, pub) => {
    const row = document.createElement("div");
    const label = document.createElement("span"); label.textContent = nameOf(m);
    row.append(label);
    if (pub !== me.pub) {
      const r = document.createElement("button"); r.textContent = "Rename";
      r.onclick = () => { const n = prompt("New name for " + nameOf(m) + ":", nameOf(m)); if (n && n.trim() && n.trim().length <= 20) signMod({ type: "rename", pub, name: n.trim() }); };
      const d = document.createElement("button"); d.textContent = "Delete";
      d.onclick = () => confirm("Delete account " + nameOf(m) + "? Their messages will be hidden.") && signMod({ type: "ban", pub });
      row.append(r, d);
    }
    box.append(row);
  });
}
</script>
</body>
</html>
