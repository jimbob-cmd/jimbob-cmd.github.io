<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Global Counter</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #222222;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1c1c1c; --fg: #eeeeee; }
  }
  :root[data-theme="dark"] { --bg: #1c1c1c; --fg: #eeeeee; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
  }
  h1 { font-size: 2rem; font-weight: 400; margin: 0; }
  #count { font-size: 3rem; margin: 0; }
  button { font-size: 1.1rem; padding: 0.6rem 1.4rem; cursor: pointer; }
  #status { font-size: 0.85rem; opacity: 0.6; min-height: 1em; }
</style>
</head>
<body>
  <h1>Hello, World</h1>
  <p>Total clicks from everyone:</p>
  <p id="count">...</p>
  <button id="btn">Click me</button>
  <div id="status"></div>

<script>
  // CHANGE THIS to something long and unique to you, so your counter doesn't mix with anyone else's.
  var KEY = "thisstupidtestsite_clicks_8431";
  var BASE = "https://countapi.mileshilliard.com/api/v1/";

  var countEl = document.getElementById("count");
  var statusEl = document.getElementById("status");
  var btn = document.getElementById("btn");

  function show(data) {
    var n = Number(data.value);
    countEl.textContent = isNaN(n) ? "?" : n.toLocaleString();
  }

  function call(action) {
    return fetch(BASE + action + "/" + KEY).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  // Show the current total on load. A brand-new key returns 404 until the first click.
  call("get").then(show).catch(function () {
    countEl.textContent = "0";
  });

  btn.addEventListener("click", function () {
    btn.disabled = true;
    statusEl.textContent = "";
    call("hit").then(show).catch(function () {
      statusEl.textContent = "Couldn't reach the counter service. Try again.";
    }).then(function () {
      btn.disabled = false;
    });
  });
</script>
</body>
</html>
